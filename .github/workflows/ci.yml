name: CI Pipeline

on:
  push:
    branches: [ main, master, 'test/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Static Analysis & Unit/Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare environment configuration
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          CI_TEST_DOCTOR_EMAIL: ${{ secrets.CI_TEST_DOCTOR_EMAIL || 'dr.rajesh.sharma.ci@medico-opd.in' }}
          CI_TEST_DOCTOR_PASSWORD: ${{ secrets.CI_TEST_DOCTOR_PASSWORD || 'SecureTestPass123!' }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=https://dyfrknwejqwilstcoytt.supabase.co
          SUPABASE_ANON_KEY=sb_publishable_jBV_X6q8QXB4gIRSeny0GA_YnMwkNcT
          SUPABASE_TEST_URL=${SUPABASE_TEST_URL}
          SUPABASE_TEST_ANON_KEY=${SUPABASE_TEST_ANON_KEY}
          SUPABASE_TEST_SERVICE_ROLE_KEY=${SUPABASE_TEST_SERVICE_ROLE_KEY}
          CI_TEST_DOCTOR_EMAIL=${CI_TEST_DOCTOR_EMAIL}
          CI_TEST_DOCTOR_PASSWORD=${CI_TEST_DOCTOR_PASSWORD}
          EOF
          cat .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

  build-android:
    name: Build Android APK & Emulate
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare environment configuration
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          CI_TEST_DOCTOR_EMAIL: ${{ secrets.CI_TEST_DOCTOR_EMAIL || 'dr.rajesh.sharma.ci@medico-opd.in' }}
          CI_TEST_DOCTOR_PASSWORD: ${{ secrets.CI_TEST_DOCTOR_PASSWORD || 'SecureTestPass123!' }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${SUPABASE_TEST_URL}
          SUPABASE_ANON_KEY=${SUPABASE_TEST_ANON_KEY}
          SUPABASE_TEST_URL=${SUPABASE_TEST_URL}
          SUPABASE_TEST_ANON_KEY=${SUPABASE_TEST_ANON_KEY}
          CI_TEST_DOCTOR_EMAIL=${CI_TEST_DOCTOR_EMAIL}
          CI_TEST_DOCTOR_PASSWORD=${CI_TEST_DOCTOR_PASSWORD}
          EOF
          cat .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          CI_TEST_DOCTOR_EMAIL: ${{ secrets.CI_TEST_DOCTOR_EMAIL || 'dr.rajesh.sharma.ci@medico-opd.in' }}
          CI_TEST_DOCTOR_PASSWORD: ${{ secrets.CI_TEST_DOCTOR_PASSWORD || 'SecureTestPass123!' }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${SUPABASE_TEST_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_TEST_ANON_KEY}" \
            --dart-define=SUPABASE_TEST_URL="${SUPABASE_TEST_URL}" \
            --dart-define=SUPABASE_TEST_ANON_KEY="${SUPABASE_TEST_ANON_KEY}" \
            --dart-define=CI_TEST_DOCTOR_EMAIL="${CI_TEST_DOCTOR_EMAIL}" \
            --dart-define=CI_TEST_DOCTOR_PASSWORD="${CI_TEST_DOCTOR_PASSWORD}"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Prune unused Android NDK and Boost
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk* /usr/local/share/boost || true
          df -h

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger

      - name: Run on Android Emulator & Capture Screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n com.medico.opd.medico_opd/.MainActivity
            # Allow time for app launch, kDebugMode auto-login, real Supabase auth & RLS profile fetch
            sleep 35
            adb exec-out screencap -p > screenshot_clinic_profile_android.png
            cp screenshot_clinic_profile_android.png screenshot_android.png
            ls -lh screenshot_clinic_profile_android.png

      - name: Upload Android Clinic Profile Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_clinic_profile_android
          path: screenshot_clinic_profile_android.png
          if-no-files-found: error

      - name: Upload Android Screenshot (Legacy Alias)
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_android
          path: screenshot_android.png
          if-no-files-found: error

  build-ios:
    name: Build iOS Target & Simulate
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare environment configuration
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          CI_TEST_DOCTOR_EMAIL: ${{ secrets.CI_TEST_DOCTOR_EMAIL || 'dr.rajesh.sharma.ci@medico-opd.in' }}
          CI_TEST_DOCTOR_PASSWORD: ${{ secrets.CI_TEST_DOCTOR_PASSWORD || 'SecureTestPass123!' }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${SUPABASE_TEST_URL}
          SUPABASE_ANON_KEY=${SUPABASE_TEST_ANON_KEY}
          SUPABASE_TEST_URL=${SUPABASE_TEST_URL}
          SUPABASE_TEST_ANON_KEY=${SUPABASE_TEST_ANON_KEY}
          CI_TEST_DOCTOR_EMAIL=${CI_TEST_DOCTOR_EMAIL}
          CI_TEST_DOCTOR_PASSWORD=${CI_TEST_DOCTOR_PASSWORD}
          EOF
          cat .env

      - name: Install dependencies
        run: flutter pub get

      - name: Boot Simulator, Build and Capture Screenshot
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          CI_TEST_DOCTOR_EMAIL: ${{ secrets.CI_TEST_DOCTOR_EMAIL || 'dr.rajesh.sharma.ci@medico-opd.in' }}
          CI_TEST_DOCTOR_PASSWORD: ${{ secrets.CI_TEST_DOCTOR_PASSWORD || 'SecureTestPass123!' }}
        run: |
          # 1. Select and boot available iPhone simulator
          UDID=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone' | sed -E 's/.* \(([-0-9A-F]+)\).*/\1/')
          echo "Selected Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" || true

          # 2. Build iOS app for simulator
          flutter build ios --simulator --debug --no-codesign \
            --dart-define=SUPABASE_URL="${SUPABASE_TEST_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_TEST_ANON_KEY}" \
            --dart-define=SUPABASE_TEST_URL="${SUPABASE_TEST_URL}" \
            --dart-define=SUPABASE_TEST_ANON_KEY="${SUPABASE_TEST_ANON_KEY}" \
            --dart-define=CI_TEST_DOCTOR_EMAIL="${CI_TEST_DOCTOR_EMAIL}" \
            --dart-define=CI_TEST_DOCTOR_PASSWORD="${CI_TEST_DOCTOR_PASSWORD}"

          # 3. Locate app bundle and install
          APP_PATH=$(find build/ios/iphonesimulator -name "*.app" -maxdepth 2 | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          # 4. Launch app
          xcrun simctl launch "$UDID" com.medico.opd.medicoOpd
          # Allow time for app launch, kDebugMode auto-login, real Supabase auth & RLS profile fetch
          sleep 45

          # 5. Capture screenshot
          xcrun simctl io "$UDID" screenshot screenshot_clinic_profile_ios.png
          cp screenshot_clinic_profile_ios.png screenshot_ios.png
          ls -lh screenshot_clinic_profile_ios.png

      - name: Upload iOS Clinic Profile Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_clinic_profile_ios
          path: screenshot_clinic_profile_ios.png
          if-no-files-found: error

      - name: Upload iOS Screenshot (Legacy Alias)
        uses: actions/upload-artifact@v4
        with:
          name: screenshot_ios
          path: screenshot_ios.png
          if-no-files-found: error
